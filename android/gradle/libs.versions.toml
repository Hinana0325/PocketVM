[versions]
agp = "9.1.1"
# Issue #1：kotlin 版本同时决定 Kotlin 本身与 Compose 编译器插件
# （kotlin-compose / kotlin-serialization 都用 version.ref = "kotlin"，单点来源）。
# 升级基础库时必须三件一起对齐：Kotlin（含 Compose 编译器插件）+ Compose BOM + AGP，
# 升级后在 CI 跑通构建/单元测试再合入；不要只升其中一个。
# （本次 Kotlin 2.1.0 → 2.2.10 是 Android 17 升级 AGP 9.1.1 强制要求的，
# AGP 9.1 的 KGP 下限就是 2.2.10；Compose BOM 本次未动，仍为 2024.10.01。）
kotlin = "2.2.10"
coreKtx = "1.13.1"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
# Navigation Compose：2.8.9 是 2.8.x 最新稳定版，与 Compose BOM 2024.10.01
# （Compose 1.7）同代，类型安全路由在 2.8.0 已稳定。不要升 2.10.x：
# 官方 release notes 写明 2.10.x 要求 AGP 9.2.0+，本项目是 AGP 9.1.1，
# 升 2.10.x 会强制升级 AGP（见 navigation 官方 release notes 2.10.0-alpha03）。
navigationCompose = "2.8.9"
# DataStore Preferences：P1 杀进程恢复（LastRouteStore 存上次路由 key）。
# 1.1.4 是与 AGP 9.1.1 / Kotlin 2.2.10 同期的稳定版，只存一个字符串，
# 不引 Room/Proto，够用；应用偏好（P2）也走它。
datastorePreferences = "1.1.4"
# Room 2.7.2：2.7.x 最新稳定版（2025-06-18）。2.7.0 起 room-ktx 已并入
# room-runtime，不要再引 room-ktx。当前最新稳定是 2.8.5，方案定 2.7.x，
# 升 2.8.x 是另一个版本决策，不顺手带。
room = "2.7.2"
# KSP：Room 代码生成用。版本号第一段必须与 Kotlin 版本一致
# （Kotlin 2.2.10 → KSP 2.2.10-2.0.2，KSP2）；升级 Kotlin 时一起升，
# 否则 Room 的代码生成会在编译期失败。
ksp = "2.2.10-2.0.2"
composeBom = "2024.10.01"
serializationJson = "1.7.3"
# Ktor（调试接口 docs/debug-api.md）：3.3.0 的 kotlin-stdlib 依赖是 2.2.10，
# 与本项目 Kotlin 完全对齐；3.6.x 已升到 Kotlin 2.3.x，别顺手升。
ktor = "3.3.0"
coroutines = "1.9.0"
junit = "4.13.2"
jsch = "0.2.20"
# Hilt 2.59.1：2.57.2 的 Hilt Gradle 插件在 AGP 9.1.1 上应用即失败
#（"Android BaseExtension not found"，dagger#4944），因 2.57.x 仍找 AGP 9
# 已移除的旧 BaseExtension；2.59.1（2026 年初）要求 AGP 9.0+，支持 AGP 9。
# 2.60.x 存在但未验证与 Kotlin 2.2.10 / AGP 9.1.1 的配对，先不升。
# 代码生成走 KSP，与 Room 共用 KSP 2.2.10-2.0.2。
hilt = "2.59.1"
# androidx.hilt 1.3.0：能跟 AGP 9.1.1 用的最新稳定版——1.4.0 要求
# AGP 9.2.0+（官方 release notes：Compose compileSdk 升到 37），不能用。
# 1.3.0 起 hiltViewModel() 搬到 hilt-lifecycle-viewmodel-compose
#（包名 androidx.hilt.lifecycle.viewmodel.compose）；hilt-work 与
# hilt-compiler 在同一版本线。1.3.0-alpha01 起要求 KGP ≥ 2.0、支持 KSP2。
androidxHilt = "1.3.0"
# WorkManager 2.12.0：最新稳定版（2026-09-23，官方 release notes）。
# 2.12.0 起 minSdk 24，本项目 minSdk 30，不受影响。
workManager = "2.12.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# 调试接口：Ktor server（CIO）+ kotlinx-json 内容协商。
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktor" }
ktor-server-content-negotiation = { group = "io.ktor", name = "ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { group = "io.ktor", name = "ktor-server-test-host", version.ref = "ktor" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
jsch = { group = "com.github.mwiede", name = "jsch", version.ref = "jsch" }
# Hilt（P3）：核心 + Compose 的 hiltViewModel + WorkManager 的 @HiltWorker。
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHilt" }
# WorkManager（P3）：只用 work-runtime-ktx（CoroutineWorker）。
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Hilt Gradle 插件（P3）：@AndroidEntryPoint / @HiltViewModel 的字节码转换
# 靠它；只声明版本，应用在 app 模块。2.57.2 修了 Gradle 9 / AGP 9 的兼容。
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

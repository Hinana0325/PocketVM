org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9.1.1 内置 Kotlin 默认禁止 kotlin.sourceSets DSL 加源码，但 KSP
# 2.2.10-2.0.2 仍用旧方式注册生成目录（build/generated/ksp/*/kotlin），
# 否则配置期报 "Using kotlin.sourceSets DSL ... is not allowed with
# built-in Kotlin"。此为报错本身给出的官方抑制开关；等 KSP/Kotlin
# 升级到按新方式注册的版本后再去掉。
android.disallowKotlinSourceSets=false

name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Issue #1：kotlin-compose / kotlin-serialization 必须用
      # version.ref = "kotlin"（单点来源），禁止单独写死版本，否则 Kotlin 与
      # Compose 编译器插件版本脱钩会编译报错。改 libs.versions.toml 时别绕过它。
      - name: Check Kotlin plugin version binding (Issue #1)
        run: |
          grep '^kotlin-compose = .*version\.ref = "kotlin"' android/gradle/libs.versions.toml
          grep '^kotlin-serialization = .*version\.ref = "kotlin"' android/gradle/libs.versions.toml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK 37
        uses: android-actions/setup-android@v4

      - name: Install Android platform 37
        run: |
          yes | sdkmanager --licenses > /dev/null
          # Android 17（API 37）目前只在 Preview channel（Android Studio 里是
          # “Android Cinnamon Bun Preview”），stable channel 还没有
          # platforms;android-37；--channel=3（Canary，含以下所有 channel）才能装到。
          # 见 https://developer.android.com/about/versions/17/setup-sdk
          sdkmanager --channel=3 "platforms;android-37"
          sdkmanager "build-tools;36.0.0"
          # AGP 9.1.1 默认 build-tools 若为 37.x 也一并装上；37.0.0 尚不存在时不致命。
          sdkmanager --channel=3 "build-tools;37.0.0" || echo "build-tools 37.0.0 not yet published, continuing with 36.0.0"

      # Unit tests are pure JVM (no Robolectric, no androidTest source set),
      # so no emulator or device is needed.
      - name: Run unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

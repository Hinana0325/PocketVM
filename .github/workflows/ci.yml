name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Issue #1：kotlin-compose / kotlin-serialization 必须用
      # version.ref = "kotlin"（单点来源），禁止单独写死版本，否则 Kotlin 与
      # Compose 编译器插件版本脱钩会编译报错。改 libs.versions.toml 时别绕过它。
      - name: Check Kotlin plugin version binding (Issue #1)
        run: |
          grep '^kotlin-compose = .*version\.ref = "kotlin"' android/gradle/libs.versions.toml
          grep '^kotlin-serialization = .*version\.ref = "kotlin"' android/gradle/libs.versions.toml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK 37
        uses: android-actions/setup-android@v4

      - name: Install Android platform 37
        run: |
          yes | sdkmanager --licenses > /dev/null
          # API 37 带 minor 版本：仓库里只有 android-37.0/37.1/37.2，没有裸的
          # android-37，写错就报 "Failed to find package"（已踩两次）。AGP 9.1.1 的
          # build-tools 仍钉在 36.0.0，不跟 compileSdk 走。
          # --channel=3（Canary，含以下所有 channel）是保险：37.0 可能还在
          # Preview channel，未进 stable。
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"

      # Unit tests are pure JVM (no Robolectric, no androidTest source set),
      # so no emulator or device is needed.
      - name: Run unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace
